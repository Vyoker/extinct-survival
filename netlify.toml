[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Halaman admin tidak diindeks mesin pencari (bukan pengaman utama —
# pengamanan sesungguhnya ada di password ADMIN_PASSWORD pada Functions).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
