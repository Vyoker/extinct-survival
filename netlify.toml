[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Halaman admin tidak diindeks mesin pencari (bukan pengaman utama —
# pengamanan sesungguhnya ada di password ADMIN_PASSWORD pada Functions).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Dashboard proyek membaca versi live ES dari js/version.js (lintas origin),
# jadi file ini butuh header CORS. (v0.8.1, 25 Nov 2026.)
[[headers]]
  for = "/js/version.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
