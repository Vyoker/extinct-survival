<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Extinct Survival</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/themes/dark.css" id="theme-style">
<link rel="stylesheet" href="css/battle.css">
<link rel="stylesheet" href="css/spinwheel.css">
<link rel="stylesheet" href="css/prolog.css">
<link rel="stylesheet" href="css/menu-flyout.css">
<link rel="stylesheet" href="css/topup.css">
<link rel="stylesheet" href="css/design.css">
<link rel="stylesheet" href="css/battle-dayr.css">
</head>
<body>

  <!-- ===================== SCREEN: LOGIN ===================== -->
  <div id="screen-login" class="screen active">
    <div class="login-box">
      <h1 class="game-title">EXTINCT <span>SURVIVAL</span></h1>
      <p class="game-subtitle">20 tahun pasca The Great Collapse</p>

      <div class="form-group">
        <input type="text" id="input-username" placeholder="Nama Karakter" maxlength="16">
      </div>

      <div class="form-group">
        <select id="input-start-location">
          <option value="surabaya_stronghold">Surabaya Stronghold</option>
          <option value="bandung_collective">Bandung Collective</option>
          <option value="bali_enclave">Bali Enclave</option>
          <option value="jakarta_ruins">Jakarta Ruins</option>
          <option value="kalimantan_wilds">Kalimantan Wilds</option>
        </select>
      </div>

      <button id="btn-start-game" class="btn btn-primary">MULAI BERTAHAN HIDUP</button>
      <button id="btn-continue-game" class="btn btn-secondary hidden">LANJUTKAN</button>
      <button id="btn-cloud-restore" class="btn btn-secondary">MUAT DARI CLOUD</button>

      <p class="login-hint">Data tersimpan otomatis di perangkat ini (localStorage).</p>
      <p class="login-hint" id="login-version">v0.3.4</p>
    </div>
  </div>

  <!-- ===================== SCREEN: PROLOG ===================== -->
  <!-- Tampil sekali sesudah karakter baru dibuat, sebelum masuk dashboard -->
  <div id="screen-prolog" class="screen">
    <span class="prolog-skip-hint">Tap Lanjutkan untuk lewati</span>
    <div class="prolog-viewport">
      <div class="prolog-crawl" id="prolog-crawl-text"></div>
    </div>
    <button id="btn-prolog-continue" class="btn btn-primary prolog-continue-btn">LANJUTKAN ▶</button>
  </div>

  <!-- ===================== SCREEN: GAME ===================== -->
  <div id="screen-game" class="screen">

    <!-- Top bar: survival stats -->
    <header id="hud-top">
      <div class="hud-player-info">
        <span id="hud-player-name">-</span>
        <span id="hud-player-level">Lv.1</span>
      </div>
      <div class="hud-exp-bar">
        <div class="bar-track">
          <div id="bar-exp" class="bar-fill exp"></div>
        </div>
      </div>
      <div class="hud-stats">
        <div class="stat-pill health"><svg class="xicon"><use href="#xi-heart"/></svg> <span id="stat-health">100</span></div>
        <div class="stat-pill hunger"><svg class="xicon"><use href="#xi-meat"/></svg> <span id="stat-hunger">100</span></div>
        <div class="stat-pill thirst"><svg class="xicon"><use href="#xi-droplet"/></svg> <span id="stat-thirst">100</span></div>
        <div class="stat-pill sanity"><svg class="xicon"><use href="#xi-eye"/></svg> <span id="stat-sanity">100</span></div>
      </div>
      <div class="hud-energy">
        <span class="energy-icon"><svg class="xicon"><use href="#xi-bolt"/></svg></span>
        <div class="bar-track small">
          <div id="bar-energy" class="bar-fill energy"></div>
        </div>
        <span id="text-energy">100/100</span>
      </div>
    </header>

    <!-- Main content panel (swapped by panels.js) -->
    <main id="main-panel">
      <!-- Dashboard panel injected here by default -->
    </main>

    <!-- Bottom nav -->
    <nav id="hud-bottom">
      <button class="nav-btn active" data-panel="dashboard"><svg class="xicon"><use href="#xi-home"/></svg><span>Home</span></button>
      <button class="nav-btn" data-panel="exploration"><svg class="xicon"><use href="#xi-map"/></svg><span>Jelajah</span></button>
      <button class="nav-btn" data-panel="inventory"><svg class="xicon"><use href="#xi-backpack"/></svg><span>Tas</span></button>
      <button class="nav-btn" data-panel="skills"><svg class="xicon"><use href="#xi-medal"/></svg><span>Skill</span></button>
      <button class="nav-btn" id="btn-nav-menu"><svg class="xicon"><use href="#xi-menu"/></svg><span>Menu</span></button>
    </nav>
  </div>

  <!-- ===================== SCREEN: BATTLE (TACTICAL) ===================== -->
  <!-- Layout ala Day R Survival: panel kiri (kartu pemain + aksi),
       arena tengah, panel kanan (kartu musuh). Di layar portrait
       sempit, panel-panel menumpuk otomatis via CSS. -->
  <div id="screen-battle-tactical" class="screen">

    <div id="battle-layout">
      <aside id="battle-side">
        <div id="topbar" class="drk-panel">
          <div id="pAvatar"><svg class="xicon"><use href="#xi-survivor"/></svg></div>
          <div id="pInfo">
            <div id="pName">VYOKER</div>
            <div class="barRow"><span class="barLabel hp"><svg class="xicon"><use href="#xi-plus"/></svg></span><div class="barTrack"><div class="barFill hp" id="hpFill"></div></div><span class="barVal" id="hpVal">100/100</span></div>
            <div class="barRow"><span class="barLabel"><svg class="xicon"><use href="#xi-shield"/></svg></span><div class="barTrack"><div class="barFill arm" id="armFill"></div></div><span class="barVal" id="armVal">0</span></div>
            <div id="apPips"></div>
          </div>
        </div>
        <div id="turnTag">Giliranmu</div>
        <div id="actionRow"></div>
      </aside>

      <div id="boardWrap">
        <div id="board"></div>
        <div id="banner"></div>
      </div>

      <aside id="battle-foes">
        <div class="foes-title">MUSUH</div>
        <div id="enemyStrip"></div>
      </aside>
    </div>

    <div id="dock">
      <div id="bottomRow">
        <div id="fleeBtn"><svg class="xicon"><use href="#xi-door"/></svg> Kabur</div>
        <div id="endTurnBtn">Akhiri Putaran</div>
      </div>
    </div>

    <div id="modal">
      <div id="modalBox">
        <div id="modalTitle">Menang</div>
        <div id="modalDesc"></div>
        <div id="modalBtn">OK</div>
      </div>
    </div>
  </div>

  <!-- Toast & overlay di level body supaya bisa dipakai dari layar mana pun
       (termasuk layar login yang #screen-game-nya display:none) -->
  <div id="toast-container"></div>
  <div id="overlay-root"></div>

  <!-- ===================== SCRIPTS ===================== -->
  <script src="js/version.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/engine/core.js"></script>
  <script src="js/engine/state.js"></script>
  <script src="js/engine/events.js"></script>
  <script src="js/data/item-db.js"></script>
  <script src="js/data/location-db.js"></script>
  <script src="js/game/cooldown.js"></script>
  <script src="js/game/rarity.js"></script>
  <script src="js/game/player.js"></script>
  <script src="js/game/inventory.js"></script>
  <script src="js/game/exploration.js"></script>
  <script src="js/game/battle-engine.js"></script>
  <script src="js/game/battle-bridge.js"></script>
  <script src="js/game/skills.js"></script>
  <script src="js/game/shop.js"></script>
  <script src="js/game/topup.js"></script>
  <script src="js/game/cloudsave.js"></script>
  <script src="js/game/mail.js"></script>
  <script src="js/game/crafting.js"></script>
  <script src="js/game/ads.js"></script>
  <script src="js/game/spinwheel.js"></script>
  <script src="js/game/quests.js"></script>
  <script src="js/game/factions.js"></script>
  <script src="js/game/pass.js"></script>
  <script src="js/ui/renderer.js"></script>
  <script src="js/ui/overlay-manager.js"></script>
  <script src="js/ui/panels.js"></script>
  <script src="js/ui/notifications.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
