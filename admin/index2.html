<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extinct Survival — Admin Topup</title>
<style>
  :root {
    --bg2: #1e1a16;
    --glass: rgba(21,18,16,0.75);
    --border: #2e2620;
    --text: #e8e0d5;
    --dim: #8a7f70;
    --orange: #ff6b1a;
    --red: #c0392b;
    --green: #4ade80;
    --blue: #4f9fd8;
    --yellow: #f5c518;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(ellipse at top, #1c150e, #0a0a0a 70%);
    color: var(--text);
    font-family: 'Segoe UI', Arial, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 16px; color: var(--orange); margin: 0 0 4px; }
  .sub { font-size: 11px; color: var(--dim); margin-bottom: 20px; }

  #login-view { max-width: 320px; margin: 60px auto; text-align: center; display: none; }
  #login-view input {
    width: 100%; padding: 12px; margin-top: 16px;
    background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; font-size: 14px;
  }
  #login-view button {
    width: 100%; padding: 12px; margin-top: 10px;
    background: var(--orange); color: #0a0a0a; border: none;
    border-radius: 6px; font-weight: bold; font-size: 13px;
  }
  #login-error { color: var(--red); font-size: 11px; margin-top: 8px; min-height: 14px; }

  #dash-view { display: none; max-width: 720px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .btn-logout { background: none; border: 1px solid var(--border); color: var(--dim); padding: 6px 12px; border-radius: 6px; font-size: 11px; }

  .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
  .stat-box { background: var(--glass); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
  .stat-box .num { font-size: 18px; font-weight: bold; color: var(--orange); }
  .stat-box .lbl { font-size: 10px; color: var(--dim); margin-top: 2px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tab-btn {
    background: var(--bg2); border: 1px solid var(--border); color: var(--dim);
    padding: 6px 12px; border-radius: 20px; font-size: 11px;
  }
  .tab-btn.active { background: var(--orange); color: #0a0a0a; border-color: var(--orange); font-weight: bold; }

  .order-card { background: var(--glass); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .order-code { font-family: 'Courier New', monospace; letter-spacing: 1px; color: var(--orange); font-weight: bold; font-size: 13px; }
  .badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
  .badge.pending { background: rgba(245,197,24,0.15); color: var(--yellow); }
  .badge.approved { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge.claimed { background: rgba(79,159,216,0.15); color: var(--blue); }
  .badge.rejected { background: rgba(192,57,43,0.15); color: var(--red); }
  .badge.expired { background: rgba(138,127,112,0.15); color: var(--dim); }

  .order-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); padding: 2px 0; }
  .order-row b { color: var(--text); font-weight: normal; }
  .order-amount { font-size: 15px; font-weight: bold; color: var(--orange); }

  .order-actions { display: flex; gap: 8px; margin-top: 10px; }
  .order-actions button { flex: 1; padding: 8px; border-radius: 6px; font-size: 12px; border: none; font-weight: bold; }
  .btn-approve { background: var(--green); color: #06210f; }
  .btn-reject { background: transparent; border: 1px solid var(--red); color: var(--red); }

  .empty-state { text-align: center; color: var(--dim); font-size: 12px; padding: 40px 0; }
  #refresh-line { text-align: center; font-size: 10px; color: var(--dim); margin-top: 10px; }
</style>
</head>
<body>

  <div id="login-view">
    <h1>🔐 Extinct Survival — Admin</h1>
    <p class="sub">Dashboard verifikasi topup. Khusus developer.</p>
    <input type="password" id="input-password" placeholder="Password admin" autocomplete="current-password">
    <button id="btn-login">Masuk</button>
    <div id="login-error"></div>
  </div>

  <div id="dash-view">
    <div class="topbar">
      <div>
        <h1>💳 Verifikasi Topup</h1>
        <p class="sub">Extinct Survival — dashboard developer</p>
      </div>
      <button class="btn-logout" id="btn-logout">Keluar</button>
    </div>

    <div class="stats-row">
      <div class="stat-box"><div class="num" id="stat-pending">-</div><div class="lbl">Pending</div></div>
      <div class="stat-box"><div class="num" id="stat-approved">-</div><div class="lbl">Approved hari ini</div></div>
      <div class="stat-box"><div class="num" id="stat-kredit">-</div><div class="lbl">💎 Terkirim hari ini</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="pending">Pending</button>
      <button class="tab-btn" data-tab="approved">Approved</button>
      <button class="tab-btn" data-tab="rejected">Rejected</button>
      <button class="tab-btn" data-tab="all">Semua</button>
    </div>

    <div id="order-list"></div>
    <p id="refresh-line">Auto-refresh tiap 10 detik</p>
  </div>

<script>
(function () {
  'use strict';

  const API_BASE = '/.netlify/functions';
  let password = sessionStorage.getItem('es_admin_pw') || '';
  let currentTab = 'pending';
  let allOrders = [];
  let refreshHandle = null;

  const loginView = document.getElementById('login-view');
  const dashView = document.getElementById('dash-view');

  function fmtRupiah(n) { return 'Rp' + Number(n).toLocaleString('id-ID'); }
  function fmtTime(ts) {
    const d = new Date(ts);
    return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  async function apiCall(path, opts) {
    opts = opts || {};
    const res = await fetch(API_BASE + path, Object.assign({}, opts, {
      headers: Object.assign({}, opts.headers || {}, { 'x-admin-password': password })
    }));
    const data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
    return data;
  }

  function doLogin() {
    const input = document.getElementById('input-password');
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    const pw = input.value.trim();
    if (!pw) return;

    fetch(API_BASE + '/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    })
      .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
      .then(function (result) {
        if (!result.ok || !result.data.ok) {
          errEl.textContent = (result.data && result.data.error) || 'Password salah.';
          return;
        }
        password = pw;
        sessionStorage.setItem('es_admin_pw', pw);
        showDashboard();
      })
      .catch(function () { errEl.textContent = 'Gagal terhubung ke server.'; });
  }

  function logout() {
    sessionStorage.removeItem('es_admin_pw');
    password = '';
    if (refreshHandle) clearInterval(refreshHandle);
    dashView.style.display = 'none';
    loginView.style.display = 'block';
  }

  function showDashboard() {
    loginView.style.display = 'none';
    dashView.style.display = 'block';
    loadOrders();
    if (refreshHandle) clearInterval(refreshHandle);
    refreshHandle = setInterval(loadOrders, 10000);
  }

  function loadOrders() {
    apiCall('/admin-orders')
      .then(function (data) {
        allOrders = data.orders || [];
        renderStats();
        renderList();
      })
      .catch(function (e) {
        if (String(e.message).indexOf('Unauthorized') !== -1) logout();
      });
  }

  function renderStats() {
    const pending = allOrders.filter(function (o) { return o.status === 'pending'; }).length;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const approvedToday = allOrders.filter(function (o) { return o.approvedAt && o.approvedAt >= today.getTime(); });
    document.getElementById('stat-pending').textContent = pending;
    document.getElementById('stat-approved').textContent = approvedToday.length;
    document.getElementById('stat-kredit').textContent = approvedToday.reduce(function (a, o) { return a + (o.kredit || 0); }, 0).toLocaleString('id-ID');
  }

  function renderList() {
    const listEl = document.getElementById('order-list');
    let filtered = allOrders;
    if (currentTab !== 'all') {
      filtered = allOrders.filter(function (o) {
        return o.status === currentTab || (currentTab === 'approved' && o.status === 'claimed');
      });
    }

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="empty-state">Tidak ada order di kategori ini.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(function (o) {
      const canAct = o.status === 'pending' || o.status === 'expired';
      return (
        '<div class="order-card">' +
          '<div class="order-top">' +
            '<span class="order-code">' + o.orderCode + '</span>' +
            '<span class="badge ' + o.status + '">' + o.status.toUpperCase() + '</span>' +
          '</div>' +
          '<div class="order-row"><span>Player</span><b>' + (o.playerName || '-') + '</b></div>' +
          '<div class="order-row"><span>Paket</span><b>' + o.packageLabel + ' (💎' + o.kredit + ')</b></div>' +
          '<div class="order-row"><span>Nominal transfer</span><span class="order-amount">' + fmtRupiah(o.uniqueAmount) + '</span></div>' +
          '<div class="order-row"><span>Dibuat</span><b>' + fmtTime(o.createdAt) + '</b></div>' +
          (canAct
            ? ('<div class="order-actions">' +
                '<button class="btn-approve" data-approve="' + o.orderCode + '">✅ Approve</button>' +
                '<button class="btn-reject" data-reject="' + o.orderCode + '">✕ Reject</button>' +
              '</div>')
            : '') +
        '</div>'
      );
    }).join('');

    listEl.querySelectorAll('[data-approve]').forEach(function (btn) {
      btn.addEventListener('click', function () { approveOrder(btn.dataset.approve); });
    });
    listEl.querySelectorAll('[data-reject]').forEach(function (btn) {
      btn.addEventListener('click', function () { rejectOrder(btn.dataset.reject); });
    });
  }

  function approveOrder(orderCode) {
    const sure = confirm('Sudah cek mutasi masuk sesuai nominal untuk order ' + orderCode + '? Approve akan langsung mengirim Kredit ke pemain.');
    if (!sure) return;
    apiCall('/admin-approve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderCode: orderCode })
    }).then(loadOrders).catch(function (e) { alert('Gagal approve: ' + e.message); });
  }

  function rejectOrder(orderCode) {
    const reason = prompt('Alasan reject (opsional):', 'Pembayaran tidak ditemukan');
    if (reason === null) return;
    apiCall('/admin-reject', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderCode: orderCode, reason: reason })
    }).then(loadOrders).catch(function (e) { alert('Gagal reject: ' + e.message); });
  }

  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('input-password').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('btn-logout').addEventListener('click', logout);
  document.querySelectorAll('.tab-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderList();
    });
  });

  if (password) {
    showDashboard();
  } else {
    loginView.style.display = 'block';
  }
})();
</script>
</body>
</html>
